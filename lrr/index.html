<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LRR List - KRM FORUM</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard.css" />
    <style>
        :root {
            --bg-dark: #0a0d14;
            --panel-bg: #121824;
            --panel-border: rgba(255, 255, 255, 0.08);
            --accent-main: #FFB7E0;
            --accent-orange: #ff9f43;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --map-item-height: 48px;
            --sidebar-width: 340px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { scroll-behavior: smooth; }
        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Pretendard', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
        }
        a:focus, button:focus, input:focus {
            outline: 2px solid #ffffff;
            outline-offset: 1px;
        }
        header {
            background: rgba(18, 24, 36, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--panel-border);
            height: 72px;
            padding: 0 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .logo {
            font-family: 'Orbitron';
            font-size: 20px;
            font-weight: 900;
            color: #E2E8F0;
            text-decoration: none;
            padding: 8px 12px;
            margin: -8px;
        }
        .header-right {
            font-family: 'Orbitron';
            font-size: 14px;
            font-weight: 800;
            color: var(--accent-main);
            text-decoration: none;
            padding: 8px 12px;
        }
        .container {
            display: flex;
            min-height: calc(100vh - 72px);
            width: 100%;
        }
        .sidebar-overlay {
            display: none;
            position: fixed;
            top: 72px;
            left: 0;
            width: 100%;
            height: calc(100vh - 72px);
            background: rgba(0, 0, 0, 0.6);
            z-index: 99;
        }
        .sidebar-overlay.active { display: block; }
        .sidebar {
            width: var(--sidebar-width);
            background: var(--panel-bg);
            border-right: 1px solid var(--panel-border);
            display: flex;
            flex-direction: column;
            position: fixed;
            top: 72px;
            left: 0;
            height: calc(100vh - 72px);
            z-index: 100;
            transition: transform 0.3s ease;
            transform: translateX(0);
        }
        @media (max-width: 768px) {
            .sidebar { transform: translateX(-100%); }
            .sidebar.open { transform: translateX(0); }
        }
        .sidebar-header {
            padding: 16px;
            border-bottom: 1px solid var(--panel-border);
            display: flex;
            gap: 8px;
            align-items: center;
            flex-shrink: 0;
        }
        .search-input {
            width: 100%;
            padding: 10px 14px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--panel-border);
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
        }
        .close-sidebar-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--panel-border);
            color: var(--text-main);
            width: 40px;
            height: 40px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
        }
        .map-list-wrapper {
            flex-grow: 1;
            overflow-y: auto;
            position: relative;
        }
        .map-list-phantom {
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            background: transparent;
            pointer-events: none;
        }
        .map-list-visible {
            position: absolute;
            left: 0;
            right: 0;
        }
        .map-item {
            height: var(--map-item-height);
            padding: 0 18px;
            border-bottom: 1px solid var(--panel-border);
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            gap: 12px;
            will-change: background;
        }
        .map-item:hover, .map-item.active {
            background: rgba(255, 183, 224, 0.12);
        }
        .map-item .rank {
            font-family: 'Orbitron';
            color: var(--accent-main);
            font-weight: 800;
            font-size: 14px;
            flex-shrink: 0;
            min-width: 44px;
        }
        .map-item .title {
            font-weight: 700;
            font-size: 15px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .toggle-btn {
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            color: var(--text-main);
            width: 42px;
            height: 42px;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            flex-shrink: 0;
            margin: 0 auto 12px auto;
        }
        .main-content {
            flex-grow: 1;
            padding: 40px 32px;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: calc(100% - var(--sidebar-width));
            margin-left: var(--sidebar-width);
        }
        @media (max-width: 768px) {
            .main-content {
                width: 100%;
                margin-left: 0;
                padding: 24px 16px;
            }
        }
        .content-box {
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .map-header-row {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            justify-content: center;
            margin-bottom: 24px;
            width: 100%;
            text-align: left;
        }
        .map-main-title {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(22px, 5vw, 36px);
            font-weight: 900;
            word-break: keep-all;
            overflow-wrap: break-word;
            text-align: left;
            line-height: 1.3;
            margin-bottom: 10px;
            width: 100%;
        }
        .map-aredl-badge {
            font-family: 'Orbitron';
            color: var(--accent-orange);
            font-size: 16px;
            font-weight: 800;
            background: rgba(255, 159, 67, 0.12);
            padding: 4px 12px;
            border-radius: 6px;
            border: 1px solid rgba(255, 159, 67, 0.3);
            display: inline-block;
        }
        .detail-grid {
            display: grid;
            grid-template-columns: 16fr 9fr;
            gap: 24px;
            margin-bottom: 28px;
            width: 100%;
            align-items: flex-start;
        }
        .video-box {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000;
            border-radius: 14px;
            overflow: hidden;
            border: 1px solid var(--panel-border);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-sub);
        }
        .video-box iframe { width: 100%; height: 100%; border: none; }
        .info-side { display: flex; flex-direction: column; gap: 12px; width: 100%; }
        .stat-card {
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 14px;
            padding: 18px;
            width: 100%;
            border-left: 4px solid var(--accent-main);
        }
        .stat-label { font-size: 13px; color: var(--text-sub); margin-bottom: 6px; font-weight: 600; }
        .stat-value { font-size: 20px; font-weight: 800; word-break: break-all; }
        .victors-btn {
            width: 100%;
            padding: 16px;
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            color: var(--text-main);
            border-radius: 14px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            text-align: left;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .victors-list-box {
            display: none;
            margin-top: 10px;
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 14px;
            max-height: 280px;
            overflow-y: auto;
            padding: 16px 20px;
            width: 100%;
        }
        .victors-list-box.active { display: block; }
        .victor-item {
            padding: 8px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .victor-item:last-child { border-bottom: none; }
        .victor-rank { font-family: 'Orbitron'; color: var(--text-sub); font-size: 13px; width: 30px; }
        .victor-name { font-size: 15px; color: var(--text-main); text-decoration: none; }
        .victor-name.has-link { text-decoration: underline; color: var(--accent-main); cursor: pointer; }
        @media (max-width: 768px) {
            header { padding: 0 16px; height: 64px; }
            .logo { font-size: 16px; margin: 0; padding: 4px 8px; }
            .header-right { font-size: 13px; padding: 4px 8px; }
            .sidebar-overlay { top: 64px; height: calc(100vh - 64px); }
            .sidebar { height: calc(100vh - 64px); top: 64px; width: 300px; }
            .close-sidebar-btn { display: flex; }
            .toggle-btn { display: flex; margin: 0 auto 16px; }
            .map-main-title { font-size: 26px; }
            .map-aredl-badge { font-size: 14px; }
            .detail-grid { grid-template-columns: 1fr; gap: 16px; }
            .stat-card { padding: 16px; }
            .stat-value { font-size: 18px; }
        }
        @media (min-width: 769px) {
            .sidebar-overlay { display: none !important; }
            .close-sidebar-btn { display: none; }
            .toggle-btn { display: none; }
        }
    </style>
</head>
<body>
    <header>
        <a href="/" class="logo">KRM FORUM</a>
        <a href="/lrr/" class="header-right">LRR LIST</a>
    </header>
    <div class="container">
        <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <input type="text" class="search-input" id="searchInput" placeholder="맵 이름 검색..." oninput="filterMaps()" />
                <button class="close-sidebar-btn" onclick="toggleSidebar()">✕</button>
            </div>
            <div class="map-list-wrapper" id="mapListWrapper">
                <div class="map-list-phantom" id="mapListPhantom"></div>
                <div class="map-list-visible" id="mapListVisible"></div>
            </div>
        </aside>
        <main class="main-content">
            <div class="content-box">
                <button class="toggle-btn" onclick="toggleSidebar()">☰</button>
                <div class="map-header-row">
                    <h1 class="map-main-title" id="mapTitle">#1. Loading...</h1>
                    <span class="map-aredl-badge" id="mapAredlBadge" style="display:none;">AREDL -</span>
                </div>
                <div class="detail-grid">
                    <div class="video-box" id="videoContainer">
                        <span>영상을 불러오는 중...</span>
                    </div>
                    <div class="info-side">
                        <div class="stat-card">
                            <div class="stat-label">First Korean LRR Mobile Victor</div>
                            <div class="stat-value" id="firstVictorName">-</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-label">Total Victors</div>
                            <div class="stat-value" id="totalVictorsCount">-</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-label">List Points</div>
                            <div class="stat-value" id="listPoints">-</div>
                        </div>
                    </div>
                </div>
                <button class="victors-btn" onclick="toggleVictorsBox()">
                    <span>전체 클리어자 목록 (Victors)</span>
                    <span id="arrowIcon">▼</span>
                </button>
                <div class="victors-list-box" id="victorsBox">
                    <div id="victorsContainer"></div>
                </div>
            </div>
        </main>
    </div>
    <script>
        const MAIN_SHEET_ID = '1yP5sJXHAA_dO0iv74nhx4vaT21J2Rl0cNXdzipsB-Y8';
        const MAIN_SHEET_URL = `https://docs.google.com/spreadsheets/d/${MAIN_SHEET_ID}/gviz/tq?tqx=out:json`;
        const VIDEO_SHEET_ID = '12q_IKRxveTruikwBjPMGWxCavBjlp9jaTMX-KLCbcF8';
        const VIDEO_SHEET_URL = `https://docs.google.com/spreadsheets/d/${VIDEO_SHEET_ID}/gviz/tq?tqx=out:json&gid=1240231056`;
        const ITEM_HEIGHT = 48;
        const BUFFER = 8;
        const CACHE_KEY_MAIN = 'lrr_main_data';
        const CACHE_KEY_VIDEO = 'lrr_video_data';
        const CACHE_TTL = 10 * 60 * 1000;
        let mapDataList = [];
        let filteredList = [];
        let videoMap = {};
        let selectedIndex = -1;

        function isValidUrl(string) {
            try {
                const url = new URL(string);
                return url.protocol === "http:" || url.protocol === "https:";
            } catch (_) {
                return false;
            }
        }

        function extractYoutubeId(url) {
            if (!url) return null;
            let m = url.match(/youtu\.be\/([a-zA-Z0-9_-]{11})/);
            if (m) return m[1];
            m = url.match(/(?:v=|\/embed\/|\/watch\?v=)([a-zA-Z0-9_-]{11})/);
            return m ? m[1] : null;
        }

        function saveToCache(key, data) {
            try {
                const payload = { timestamp: Date.now(), data };
                localStorage.setItem(key, JSON.stringify(payload));
            } catch (e) { console.warn('캐시 저장 실패:', e); }
        }

        function loadFromCache(key) {
            try {
                const raw = localStorage.getItem(key);
                if (!raw) return null;
                const payload = JSON.parse(raw);
                if (Date.now() - payload.timestamp > CACHE_TTL) return null;
                return payload.data;
            } catch (e) { return null; }
        }

        async function loadSheetData() {
            const cachedMain = loadFromCache(CACHE_KEY_MAIN);
            const cachedVideo = loadFromCache(CACHE_KEY_VIDEO);
            let hasCached = false;
            if (cachedMain) {
                applyMainData(cachedMain);
                hasCached = true;
            }
            if (cachedVideo) {
                videoMap = cachedVideo;
                hasCached = true;
            }
            if (hasCached) {
                console.log('✅ LRR 캐시 로드 완료');
                handleHashChange();
            }
            let firstLoadComplete = false;
            try {
                const [mainRes, videoRes] = await Promise.allSettled([
                    fetch(MAIN_SHEET_URL),
                    fetch(VIDEO_SHEET_URL)
                ]);
                let needRerender = false;
                if (videoRes.status === 'fulfilled' && videoRes.value.ok) {
                    const freshVideo = parseVideoSheetRaw(await videoRes.value.text());
                    if (JSON.stringify(freshVideo) !== JSON.stringify(videoMap)) {
                        videoMap = freshVideo;
                        saveToCache(CACHE_KEY_VIDEO, videoMap);
                        needRerender = true;
                    }
                }
                if (mainRes.status === 'fulfilled' && mainRes.value.ok) {
                    const freshMain = parseMainSheetRaw(await mainRes.value.text());
                    if (JSON.stringify(freshMain) !== JSON.stringify(mapDataList)) {
                        saveToCache(CACHE_KEY_MAIN, freshMain);
                        applyMainData(freshMain);
                        needRerender = true;
                    }
                    if (!hasCached && mapDataList.length > 0) {
                        firstLoadComplete = true;
                    }
                }
                if (needRerender || firstLoadComplete) {
                    console.log('✅ LRR 데이터 로드 완료, 맵 표시');
                    handleHashChange();
                }
            } catch (err) {
                console.warn('시트 로드 실패:', err);
                if (!hasCached) {
                    document.getElementById('mapTitle').innerText = "데이터 로드 실패";
                }
            }
        }

        function parseVideoSheetRaw(rawText) {
            try {
                const jsonText = rawText.substring(rawText.indexOf('{'), rawText.lastIndexOf('}') + 1);
                const data = JSON.parse(jsonText);
                const rows = data.table.rows;
                const map = {};
                let currentMap = null;
                const HEADER_PATTERN = /^(이름|유저이름|링크|비디오|영상)$/i;
                let firstVictorHasLink = false; // ✅ 첫 클리어자 링크 유무 추적

                for (let i = 0; i < rows.length; i++) {
                    const row = rows[i].c;
                    if (!row) continue;
                    const colA = (row[0]?.v != null) ? String(row[0].v).trim().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/\s+/g, ' ').toLowerCase() : '';
                    const colB = (row[1]?.v != null) ? String(row[1].v).trim() : '';
                    const colC = (row[2]?.v != null) ? String(row[2].v).trim() : '';

                    const linkVal = isValidUrl(colC) ? colC : null;
                    const isYoutube = extractYoutubeId(colC) ? true : false;

                    if (colA !== '' && colA !== '.') {
                        currentMap = colA;
                        map[currentMap] = { videoUrl: null, victors: [] };
                        firstVictorHasLink = false; // ✅ 새로운 맵 시작할 때 초기화

                        // ✅ 첫 번째 클리어자
                        if (colB !== '' && !HEADER_PATTERN.test(colB)) {
                            map[currentMap].victors.push({ name: colB, link: linkVal });
                            if (linkVal && isYoutube) {
                                map[currentMap].videoUrl = linkVal;
                                firstVictorHasLink = true; // ✅ 첫 사람 링크 있음 기억
                            } else {
                                firstVictorHasLink = false; // ✅ 첫 사람 링크 없음
                            }
                        }
                    }
                    // ✅ 두 번째 이후 클리어자
                    else if (currentMap && colB !== '' && colB !== '.' && !HEADER_PATTERN.test(colB)) {
                        map[currentMap].victors.push({ name: colB, link: linkVal });
                        // ✅ 첫 사람 링크 있었을 때만 → 이어서 영상 찾기
                        if (firstVictorHasLink && !map[currentMap].videoUrl && linkVal && isYoutube) {
                            map[currentMap].videoUrl = linkVal;
                        }
                        // ❌ 첫 사람 링크 없었으면 → 절대 영상으로 쓰지 않음
                    }
                }
                return map;
            } catch(e) { console.warn("비디오 파싱 오류:", e); return {}; }
        }

        function parseMainSheetRaw(rawText) {
            const jsonText = rawText.substring(rawText.indexOf('{'), rawText.lastIndexOf('}') + 1);
            const data = JSON.parse(jsonText);
            const rows = data.table.rows;
            const list = [];
            let currentRank = 1;
            let foundStart = false;
            for (let i = 0; i < rows.length; i++) {
                const row = rows[i].c;
                if (!row?.[0]?.v) continue;
                const levelName = String(row[0].v).trim();
                const levelNameLower = levelName.toLowerCase();
                if (levelNameLower.startsWith('last update') || levelName.startsWith('Records & Information') || levelName.startsWith('최종 수정') || levelName.startsWith('출처')) continue;
                if (!foundStart) {
                    if (levelNameLower === 'waterfall' || levelNameLower.includes('waterfall') || currentRank > 1) {
                        foundStart = true;
                    } else if (row[1]?.v != null) {
                        foundStart = true;
                    } else continue;
                }
                if (levelNameLower === 'levels') continue;
                const rawCCol = (row[2]?.v != null) ? String(row[2].v).trim() : '';
                let displayRank = '', badgeText = '';
                if (rawCCol.startsWith('#') || !isNaN(rawCCol)) {
                    displayRank = `#${currentRank}`;
                    badgeText = rawCCol;
                    currentRank++;
                } else {
                    displayRank = `-`;
                    badgeText = rawCCol;
                }
                const normName = levelName.normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/\s+/g, ' ').toLowerCase();
                const customData = videoMap[normName] || null;
                const finalVictors = customData?.victors || [];
                list.push({
                    rank: displayRank,
                    title: levelName,
                    aredl: badgeText,
                    totalVictors: String(finalVictors.length),
                    listPoints: '-',
                    videoUrl: customData?.videoUrl || null,
                    victors: finalVictors
                });
            }
            return list;
        }

        function applyMainData(list) {
            mapDataList = list;
            filteredList = [...list];
            initVirtualScroll();
        }

        function initVirtualScroll() {
            const wrapper = document.getElementById('mapListWrapper');
            const phantom = document.getElementById('mapListPhantom');
            phantom.style.height = `${filteredList.length * ITEM_HEIGHT}px`;
            wrapper.removeEventListener('scroll', renderVisibleItems);
            wrapper.addEventListener('scroll', renderVisibleItems);
            renderVisibleItems();
        }

        function renderVisibleItems() {
            const wrapper = document.getElementById('mapListWrapper');
            const visible = document.getElementById('mapListVisible');
            const scrollTop = wrapper.scrollTop;
            const wrapperHeight = wrapper.clientHeight;
            const startIndex = Math.max(0, Math.floor(scrollTop / ITEM_HEIGHT) - BUFFER);
            const endIndex = Math.min(filteredList.length - 1, Math.ceil((scrollTop + wrapperHeight) / ITEM_HEIGHT) + BUFFER);
            visible.style.transform = `translateY(${startIndex * ITEM_HEIGHT}px)`;
            visible.innerHTML = '';
            const fragment = document.createDocumentFragment();
            for (let i = startIndex; i <= endIndex; i++) {
                const map = filteredList[i];
                const li = document.createElement('div');
                li.className = `map-item ${selectedIndex === mapDataList.indexOf(map) ? 'active' : ''}`;
                li.style.height = `${ITEM_HEIGHT}px`;
                li.onclick = () => {
                    selectMap(mapDataList.indexOf(map));
                    if (window.innerWidth < 770) toggleSidebar();
                };
                li.innerHTML = `<span class="rank">${map.rank}</span><span class="title" title="${map.title}">${map.title}</span>`;
                fragment.appendChild(li);
            }
            visible.appendChild(fragment);
        }

        function selectMap(index) {
            if (!mapDataList[index]) return;
            selectedIndex = index;
            const map = mapDataList[index];
            if (window.location.hash !== `#${index + 1}`) {
                history.replaceState(null, null, `#${index + 1}`);
            }
            document.getElementById('mapTitle').innerText = `${map.rank !== '-' ? map.rank + '.' : ''} ${map.title}`;
            const aredlBadge = document.getElementById('mapAredlBadge');
            if (map.aredl && map.aredl !== '-' && map.aredl !== '0' && map.aredl !== '') {
                aredlBadge.innerText = map.aredl.includes('Tier') ? map.aredl : `AREDL ${map.aredl}`;
                aredlBadge.style.display = 'inline-block';
            } else {
                aredlBadge.style.display = 'none';
            }
            document.getElementById('totalVictorsCount').innerText = map.totalVictors;
            document.getElementById('listPoints').innerText = map.listPoints;
            const videoBox = document.getElementById('videoContainer');
            const videoId = map.videoUrl ? extractYoutubeId(map.videoUrl) : null;
            if (videoId) {
                videoBox.innerHTML = `<iframe src="https://www.youtube.com/embed/${videoId}?vq=hd1080&enablejsapi=1" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`;
            } else {
                videoBox.innerHTML = `<span style="color:#64748b;">등록된 영상이 없습니다.</span>`;
            }
            document.getElementById('firstVictorName').innerText = map.victors[0]?.name || '-';
            renderVictorsList(map.victors);
            renderVisibleItems();
        }

        function renderVictorsList(victors) {
            const container = document.getElementById('victorsContainer');
            container.innerHTML = '';
            if (!victors?.length) {
                container.innerHTML = '<div style="color:var(--text-sub); font-size:14px;">클리어자가 없습니다.</div>';
                return;
            }
            victors.forEach((v, idx) => {
                const item = document.createElement('div');
                item.className = 'victor-item';
                const nameEl = (v.link && v.link.startsWith('http'))
                    ? `<a href="${v.link}" target="_blank" class="victor-name has-link">${v.name} 🔗</a>`
                    : `<span class="victor-name">${v.name}</span>`;
                item.innerHTML = `<span class="victor-rank">${idx + 1}.</span>${nameEl}`;
                container.appendChild(item);
            });
        }

        function filterMaps() {
            const q = document.getElementById('searchInput').value.toLowerCase();
            filteredList = q ? mapDataList.filter(m => m.title.toLowerCase().includes(q)) : [...mapDataList];
            const phantom = document.getElementById('mapListPhantom');
            phantom.style.height = `${filteredList.length * ITEM_HEIGHT}px`;
            document.getElementById('mapListWrapper').scrollTop = 0;
            renderVisibleItems();
        }

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
            document.getElementById('sidebarOverlay').classList.toggle('active');
        }

        function toggleVictorsBox() {
            const box = document.getElementById('victorsBox');
            box.classList.toggle('active');
            document.getElementById('arrowIcon').innerText = box.classList.contains('active') ? '▲' : '▼';
        }

        function handleHashChange() {
            const hash = window.location.hash.slice(1);
            const targetIndex = hash ? parseInt(hash) - 1 : 0;
            if (mapDataList.length > 0) {
                selectMap(Math.max(0, Math.min(targetIndex, mapDataList.length - 1)));
                const wrapper = document.getElementById('mapListWrapper');
                const itemTop = targetIndex * ITEM_HEIGHT;
                const visibleTop = wrapper.scrollTop;
                const visibleBottom = visibleTop + wrapper.clientHeight;
                if (itemTop < visibleTop) wrapper.scrollTop = itemTop;
                else if (itemTop + ITEM_HEIGHT > visibleBottom) wrapper.scrollTop = itemTop + ITEM_HEIGHT - wrapper.clientHeight;
            }
        }
        window.addEventListener('hashchange', handleHashChange);
        loadSheetData();
    </script>
</body>
</html>
